<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TERMS & CONDITIONS · 비주얼 테스트</title>
<style>body{margin:0;background:#202528;color:#e6e4de;font-family:Segoe UI,Malgun Gothic,sans-serif}main{max-width:1320px;margin:auto;padding:28px}h1{font-size:24px;font-weight:500}p{color:#b9b6ad;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:#30383b;color:#e6e4de;border:1px solid #626965;padding:12px 16px;cursor:pointer;border-radius:4px}button[aria-pressed=true]{border-color:#98b4a7;background:#3c4b47}figure{margin:0;aspect-ratio:16/9;background:#151a1c;position:relative}img,canvas{width:100%;height:100%;object-fit:contain;display:block}#motion{display:none}#note{min-height:3em}#controls{display:none;margin:14px 0}footer{font-size:13px;color:#8e9697;margin-top:20px}</style>
<main><h1>2036: TERMS & CONDITIONS</h1><p>제작 전 비주얼 테스트. 이미지·UI 동작·타이틀 검증용이며 완성 영상이 아닙니다.</p>
<nav><button data-test="char">캐릭터</button><button data-test="t1">1 · 같은 아침</button><button data-test="t2">2 · 작업물 이동</button><button data-test="t3">3 · 공공 인프라</button><button data-test="title">타이틀</button></nav>
<figure><img id="still" alt="비주얼 테스트"><canvas id="motion" width="1672" height="941" aria-label="글자 없이 보는 작업물 이동 비교"></canvas></figure>
<div id="controls"><button id="replay">5초 동작 다시 보기</button><button id="end">끝 상태 보기</button></div><p id="note"></p><footer>음성·영상 클립 없음 · 외부 통신 없음 · UI와 제목은 직접 합성 · 2026-10-06</footer></main>
<script>
const files={char:'../characters/AB_reference_2036_v001.png',t1:'T01_same_morning_v001.png',t2:'T02_composite_v001.png',t3:'T03_public_montage_v002.png',title:'TITLE_statement_v001.png'};
const notes={char:'2036년 인물 기준. 얼굴·헤어·의상·소품을 확인합니다. 2026년 얼굴 파생은 후속 제작입니다.',t1:'두 사람의 생활 수준과 노출은 대등합니다. 최종 UI 컷은 화면 정면 인서트로 연결합니다.',t2:'양쪽 모두 완성된 같은 카드가 있습니다. 왼쪽은 열린 통로를 지나고 오른쪽은 닫힌 경계에서 멈춥니다. 권한 잠금은 데이터 자체의 무제한 이동을 뜻하지 않습니다.',t3:'학교·병원 접수·공공 창구의 공간을 검증합니다. 최종 5초 클립은 각 공간을 따로 생성하고 기업 장면도 추가합니다.',title:'명제 5초 → 질문 5초. 작품 제목은 질문의 마지막 2초에만 작게 표시합니다.'};
const still=document.getElementById('still'),canvas=document.getElementById('motion'),ctx=canvas.getContext('2d'),controls=document.getElementById('controls');let active='t1',raf=0,titleTimer=0;const plate=new Image();plate.src='T02_plate_v001.png';
function ui(t){const w=canvas.width,h=canvas.height,y=.532*h;ctx.clearRect(0,0,w,h);ctx.drawImage(plate,0,0,w,h);for(let side=0;side<2;side++){const shift=side*.39*w,src=.219*w+shift,gate=.312*w+shift,dst=.412*w+shift,r=.029*w;ctx.strokeStyle='#626965';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(src,y);ctx.lineTo(dst,y);ctx.stroke();ctx.strokeStyle='#E6E4DE';ctx.beginPath();ctx.arc(src,y,r,0,Math.PI*2);ctx.stroke();ctx.strokeRect(dst-r,y-r,2*r,2*r);ctx.strokeStyle=side===0?'#98B4A7':'#E6E4DE';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(gate,.424*h);ctx.lineTo(gate,side===0?y-.055*h:.636*h);if(side===0){ctx.moveTo(gate,y+.055*h);ctx.lineTo(gate,.636*h);}ctx.stroke();if(side===1){ctx.strokeStyle='#C67567';ctx.lineWidth=3;ctx.beginPath();ctx.arc(gate,y,.012*w,Math.PI,0);ctx.stroke();ctx.fillStyle='#252B2F';ctx.fillRect(gate-.014*w,y,.028*w,.027*h);ctx.strokeRect(gate-.014*w,y,.028*w,.027*h);}const end=side===0?dst:gate-.035*w,x=src+(end-src)*Math.max(0,Math.min(1,t)),cw=.033*w,ch=.069*h;ctx.fillStyle='#E6E4DE';ctx.fillRect(x-cw/2,y-ch/2,cw,ch);ctx.fillStyle='#C67567';ctx.beginPath();ctx.moveTo(x+cw/2-12,y-ch/2);ctx.lineTo(x+cw/2,y-ch/2+12);ctx.lineTo(x+cw/2,y-ch/2);ctx.fill();ctx.strokeStyle='#8E9697';ctx.lineWidth=2;for(let j=0;j<3;j++){const yy=y-ch/2+18+j*10;ctx.beginPath();ctx.moveTo(x-cw/2+9,yy);ctx.lineTo(x+cw/2-9,yy);ctx.stroke();}}}
function replay(){cancelAnimationFrame(raf);const start=performance.now();function tick(now){if(active!=='t2')return;const t=Math.min(1,(now-start)/5000);ui(t);if(t<1)raf=requestAnimationFrame(tick);}if(plate.complete)raf=requestAnimationFrame(tick);else plate.onload=()=>{raf=requestAnimationFrame(tick);};}
function select(key){active=key;cancelAnimationFrame(raf);clearTimeout(titleTimer);still.style.display=key==='t2'?'none':'block';canvas.style.display=key==='t2'?'block':'none';controls.style.display=key==='t2'?'block':'none';still.src=files[key];document.getElementById('note').textContent=notes[key];document.querySelectorAll('[data-test]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.test===key)));if(key==='t2')replay();if(key==='title'){titleTimer=setTimeout(()=>{if(active!=='title')return;still.src='TITLE_question_v001.png';titleTimer=setTimeout(()=>{if(active==='title')still.src='TITLE_end_v001.png';},3000);},5000);}}
document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>select(b.dataset.test));document.getElementById('replay').onclick=replay;document.getElementById('end').onclick=()=>{cancelAnimationFrame(raf);ui(1);};select('t1');
</script></html>
